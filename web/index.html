<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>总览 - CiteBox</title>
    <link rel="icon" type="image/svg+xml" href="/static/img/citebox-icon.svg">
    <script>(function(){var d=document.documentElement;try{var t=localStorage.getItem("citebox_theme");if(t&&t!=="warm")d.setAttribute("data-theme",t);var l=localStorage.getItem("citebox_lang")||"zh-CN";d.lang=l;if(l!=="zh-CN")d.setAttribute("data-lang-loading","1");}catch(e){}})()</script>
    <link rel="stylesheet" href="/static/css/style.css">
</head>
<body>
    <nav class="navbar">
        <div class="navbar-content">
            <a href="/" class="logo">CiteBox</a>
            <ul class="nav-links">
                <li><a href="/" class="active" data-i18n="nav.overview">总览</a></li>
                <li><a href="/library" data-i18n="nav.library">文献库</a></li>
                <li><a href="/figures" data-i18n="nav.figures">图片库</a></li>
                <li><a href="/palettes" data-i18n="nav.palettes">配色库</a></li>
                <li><a href="/groups" data-i18n="nav.groups">分组</a></li>
                <li><a href="/tags" data-i18n="nav.tags">标签</a></li>
                <li><a href="/notes" data-i18n="nav.notes">笔记</a></li>
                <li><a href="/highlights" data-i18n="nav.highlights">高亮库</a></li>
                <li><a href="/research" data-i18n="nav.research">文献搜索</a></li>
                <li><a href="/ai" data-i18n="nav.ai">AI 助手</a></li>
                <li><a href="/settings" data-i18n="nav.settings">配置</a></li>
            </ul>
            <div class="nav-actions">
                <a href="/upload" class="nav-cta" data-i18n="nav.upload_pdf">上传 PDF</a>
            </div>
        </div>
    </nav>

    <main class="page-shell dashboard-page">
        <header class="collection-header dashboard-header">
            <h1 data-i18n="nav.overview">总览</h1>
            <a class="btn btn-outline btn-small" href="/guide" data-i18n="index.go_guide">查看功能说明</a>
        </header>

        <div id="dashboardExtractionHint" class="page-hint" hidden></div>

        <section class="dashboard-summary" aria-label="当前处理概况" data-i18n-aria-label="index.status_heading">
            <div id="dashboardSummaryStrip" class="dashboard-stats"></div>
        </section>

        <section class="dashboard-recent">
            <div class="dashboard-section-head">
                <h2 data-i18n="index.recent_heading">最近更新的文献</h2>
                <a class="dashboard-section-link" href="/library" data-i18n="index.view_all_papers">查看全部文献</a>
            </div>
            <div id="dashboardRecentPaperList" class="dashboard-recent-list"></div>
        </section>
    </main>

    <div id="paperModal" class="modal-shell hidden">
        <div class="modal-dialog">
            <button id="closePaperModal" class="modal-close" type="button" data-i18n-aria-label="btn.close" aria-label="关闭">×</button>
            <div id="paperModalBody"></div>
        </div>
    </div>

    <script src="/static/js/theme.js"></script>
    <script src="/static/js/i18n.js"></script>
    <script src="/static/js/utils.js"></script>
    <script src="/static/js/api.js"></script>
    <script src="/static/js/paper-viewer.js"></script>
    <script src="/static/js/browser-pages.js"></script>
    <script src="/static/js/figure-viewer.js"></script>
    <script src="/static/js/image-viewport.js"></script>
    <script src="/static/js/note-viewer.js"></script>
    <script src="/static/js/dashboard.js"></script>
    <script src="/static/js/translate.js"></script>
    <script src="/static/js/main.js"></script>
</body>
</html>
