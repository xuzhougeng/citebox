<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>文献搜索 - CiteBox</title>
    <link rel="icon" type="image/svg+xml" href="/static/img/citebox-icon.svg">
    <script>(function(){var d=document.documentElement;try{var t=localStorage.getItem("citebox_theme");if(t&&t!=="warm")d.setAttribute("data-theme",t);var l=localStorage.getItem("citebox_lang")||"zh-CN";d.lang=l;if(l!=="zh-CN")d.setAttribute("data-lang-loading","1");}catch(e){}})()</script>
    <link rel="stylesheet" href="/static/css/style.css">
</head>
<body>
    <nav class="navbar">
        <div class="navbar-content">
            <a href="/" class="logo">CiteBox</a>
            <ul class="nav-links">
                <li><a href="/" data-i18n="nav.overview">总览</a></li>
                <li><a href="/library" data-i18n="nav.library">文献库</a></li>
                <li><a href="/figures" data-i18n="nav.figures">图片库</a></li>
                <li><a href="/palettes" data-i18n="nav.palettes">配色库</a></li>
                <li><a href="/groups" data-i18n="nav.groups">分组</a></li>
                <li><a href="/tags" data-i18n="nav.tags">标签</a></li>
                <li><a href="/notes" data-i18n="nav.notes">笔记</a></li>
                <li><a href="/highlights" data-i18n="nav.highlights">高亮库</a></li>
                <li><a href="/research" class="active" data-i18n="nav.research">文献搜索</a></li>
                <li><a href="/ai" data-i18n="nav.ai">AI 助手</a></li>
                <li><a href="/settings" data-i18n="nav.settings">配置</a></li>
            </ul>
            <div class="nav-actions">
                <a href="/upload" class="nav-cta" data-i18n="nav.upload_pdf">上传 PDF</a>
            </div>
        </div>
    </nav>

    <main class="page-shell research-page">
        <header class="collection-header research-page-header">
            <h1 data-i18n="research.page_title">文献搜索</h1>
            <a class="btn btn-outline btn-small" href="/settings#settings-external-sources" data-i18n="research.link_settings">设置 API Key</a>
            <p class="research-page-subtitle" data-i18n="research.page_subtitle">用 Semantic Scholar 搜索论文，沿引用关系发现相关文献，先加入候选再统一导入文献库。</p>
        </header>

        <section class="filters-card collection-filters research-search-card">
            <div class="research-toolbar">
                <label class="field research-search-field">
                    <span data-i18n="research.search_label">搜索</span>
                    <div class="research-autocomplete-wrap">
                        <input id="research-search-input" class="form-input" type="text" data-i18n-placeholder="research.search.placeholder" placeholder="关键词 / DOI / arXiv ID / S2 paperId" role="combobox" aria-autocomplete="list" aria-expanded="false" aria-controls="research-autocomplete-list" aria-activedescendant="">
                        <ul id="research-autocomplete-list" class="research-autocomplete-list" role="listbox" hidden></ul>
                    </div>
                </label>
                <div class="research-toolbar-actions">
                    <button id="research-search-btn" class="btn btn-primary" type="button" data-i18n="research.action.search">搜索</button>
                    <button id="research-pick-from-library" class="btn btn-outline" type="button" data-i18n="research.action.pickFromLibrary">从文献库选起点</button>
                </div>
            </div>
            <p id="research-rate-warning" class="research-rate-warning hidden" role="status" data-i18n="research.error.rateLimited">Semantic Scholar 限流，请稍后重试。</p>
            <div id="research-search-history" class="research-history-row" hidden>
            </div>
        </section>

        <section class="research-layout">
            <article class="research-seed-pane manager-card" id="research-seed-pane">
                <div id="research-empty-state" class="research-empty">
                    <p data-i18n="research.empty.hint">搜索结果和文献的引用关系会显示在这里。</p>
                </div>
            </article>
            <aside class="research-basket-pane manager-card" id="research-basket-pane">
                <header class="research-basket-head">
                    <h3 data-i18n="research.basket.title">候选文献</h3>
                </header>
                <ul id="research-basket-list" class="research-basket-list"></ul>
                <div class="research-basket-actions">
                    <button id="research-basket-import-all" class="btn btn-primary btn-small" type="button" disabled data-i18n="research.basket.importAll">全部加入文献库</button>
                    <button id="research-basket-export" class="btn btn-outline btn-small" type="button" disabled data-i18n="research.basket.exportMarkdown">导出 Markdown 清单</button>
                    <button id="research-basket-recommend" class="btn btn-outline btn-small" type="button" disabled data-i18n="research.basket.recommendMore">基于候选推荐</button>
                </div>
            </aside>
        </section>
    </main>

    <script src="/static/js/theme.js"></script>
    <script src="/static/js/i18n.js"></script>
    <script src="/static/js/utils.js"></script>
    <script src="/static/js/api.js"></script>
    <script src="/static/js/main.js"></script>
    <script src="/static/js/research-errors.js"></script>
    <script src="/static/js/research.js?v=20261028"></script>
</body>
</html>
