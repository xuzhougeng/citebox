<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>文件查看 - CiteBox</title>
    <link rel="icon" type="image/svg+xml" href="/static/img/citebox-icon.svg">
    <script>(function(){var d=document.documentElement;try{var t=localStorage.getItem("citebox_theme");if(t&&t!=="warm")d.setAttribute("data-theme",t);var l=localStorage.getItem("citebox_lang")||"zh-CN";d.lang=l;if(l!=="zh-CN")d.setAttribute("data-lang-loading","1");}catch(e){}})()</script>
    <link rel="stylesheet" href="/static/css/style.css">
    <style>
        body.viewer-page {
            margin: 0;
            min-height: 100dvh;
            background: #181410;
            color: #fffaf4;
        }

        .viewer-shell {
            display: flex;
            min-height: 100dvh;
            flex-direction: column;
        }

        .viewer-toolbar {
            display: grid;
            grid-template-columns: auto minmax(10rem, 1fr) auto;
            align-items: center;
            gap: 0.85rem;
            padding: 0.75rem 1rem;
            background: rgba(24, 20, 16, 0.96);
            border-bottom: 1px solid rgba(255, 250, 244, 0.1);
        }

        .viewer-meta {
            display: flex;
            min-width: 0;
            flex: 1;
            flex-direction: column;
            gap: 0.2rem;
        }

        .viewer-meta span {
            color: rgba(255, 250, 244, 0.65);
            font-size: 0.82rem;
            text-transform: uppercase;
            letter-spacing: 0;
        }

        .viewer-meta strong {
            overflow: hidden;
            text-overflow: ellipsis;
            white-space: nowrap;
            font-size: 0.98rem;
        }

        .viewer-toolbar-actions {
            display: flex;
            align-items: center;
            justify-content: flex-end;
            gap: 0.75rem;
            flex-wrap: wrap;
        }

        .viewer-toolbar-actions[hidden],
        .viewer-pdf-controls[hidden],
        .viewer-pdf-loading[hidden],
        .viewer-selection-menu[hidden] {
            display: none !important;
        }

        .viewer-toolbar .btn,
        .viewer-pdf-controls .btn {
            min-height: 2.35rem;
            padding: 0.55rem 0.9rem;
            font-size: 0.9rem;
            line-height: 1;
            white-space: nowrap;
        }

        .viewer-pdf-controls {
            display: flex;
            align-items: center;
            justify-content: flex-end;
            gap: 0.45rem;
            flex-wrap: wrap;
        }

        .viewer-pdf-control-group {
            display: inline-flex;
            align-items: center;
            gap: 0.4rem;
            padding: 0.2rem;
            border-radius: 999px;
            background: rgba(255, 250, 244, 0.06);
        }

        .viewer-pdf-page-control {
            display: inline-flex;
            align-items: center;
            gap: 0.35rem;
            color: rgba(255, 250, 244, 0.72);
            font-size: 0.88rem;
        }

        .viewer-pdf-page-input {
            width: 3.6rem;
            min-height: 2.25rem;
            padding: 0.35rem 0.45rem;
            border: 1px solid rgba(255, 250, 244, 0.18);
            border-radius: 999px;
            background: rgba(255, 250, 244, 0.08);
            color: #fffaf4;
            font: inherit;
            text-align: center;
        }

        .viewer-pdf-zoom-label {
            min-width: 3.5rem;
            color: rgba(255, 250, 244, 0.72);
            font-size: 0.88rem;
            text-align: center;
        }

        .viewer-image-hint {
            color: rgba(255, 250, 244, 0.68);
            font-size: 0.82rem;
        }

        .viewer-stage {
            position: relative;
            display: flex;
            flex: 1;
            align-items: center;
            justify-content: center;
            padding: 1.5rem;
        }

        .viewer-stage.image-mode {
            cursor: default;
        }

        .viewer-stage.pdf-mode {
            align-items: stretch;
            justify-content: center;
            padding: 0;
            overflow: hidden;
            min-height: 0;
            background: #d6d0c7;
        }

        .viewer-pdf-scroll {
            position: absolute;
            inset: 0;
            width: 100%;
            height: 100%;
            min-height: 0;
            overflow: auto;
            padding: 1.25rem 0;
            background: #d6d0c7;
            scrollbar-gutter: stable both-edges;
        }

        .viewer-pdf-official {
            --scale-factor: 1;
            position: relative;
            min-height: 100%;
        }

        .viewer-pdf-scroll .pdfViewer.viewer-pdf-official .page {
            margin: 0 auto 1rem;
            border: none;
            background: #fff;
            box-shadow: 0 12px 34px rgba(35, 26, 20, 0.2);
        }

        .viewer-pdf-scroll .pdfViewer.viewer-pdf-official .textLayer {
            opacity: 1;
        }

        .viewer-pdf-scroll .pdfViewer.viewer-pdf-official .textLayer ::selection {
            background: rgba(255, 212, 0, 0.32);
        }

        .viewer-pdf-highlight-layer {
            position: absolute;
            inset: 0;
            z-index: 3;
            pointer-events: none;
        }

        .viewer-pdf-highlight-fragment {
            position: absolute;
            border-radius: 2px;
            background: rgba(255, 221, 65, 0.2);
            box-shadow: 0 0 0 1px rgba(204, 158, 0, 0.08);
            cursor: pointer;
            pointer-events: auto;
        }

        .viewer-pdf-loading {
            position: absolute;
            inset: 0;
            z-index: 4;
            display: flex;
            align-items: center;
            justify-content: center;
            background: rgba(214, 208, 199, 0.88);
            color: #3d332d;
            font-size: 0.95rem;
            line-height: 1.5;
        }

        .viewer-selection-menu {
            position: fixed;
            z-index: 1200;
            display: flex;
            gap: 0.35rem;
            padding: 0.35rem;
            border-radius: 12px;
            background: rgba(23, 18, 15, 0.94);
            border: 1px solid rgba(255, 250, 244, 0.14);
            box-shadow: 0 18px 46px rgba(0, 0, 0, 0.26);
        }

        .viewer-selection-menu button {
            border: none;
            border-radius: 9px;
            padding: 0.45rem 0.7rem;
            background: transparent;
            color: #fffaf4;
            font: inherit;
            cursor: pointer;
        }

        .viewer-selection-menu button:hover {
            background: rgba(255, 250, 244, 0.12);
        }

        .viewer-ai-ask-box {
            width: min(920px, 100%);
            display: grid;
            gap: 1rem;
            color: var(--ink);
        }

        .viewer-ai-ask-head {
            display: grid;
            gap: 0.45rem;
            padding-right: 3rem;
        }

        .viewer-ai-ask-badge {
            width: fit-content;
            padding: 0.35rem 0.75rem;
            border-radius: 999px;
            background: rgba(var(--accent-rgb), 0.12);
            color: var(--accent-deep);
            font-size: 0.78rem;
            font-weight: 800;
            letter-spacing: 0.04em;
            text-transform: uppercase;
        }

        .viewer-ai-ask-head h3 {
            margin: 0;
            font-size: clamp(1.6rem, 3vw, 2.4rem);
        }

        .viewer-ai-ask-head p {
            margin: 0;
            color: var(--muted);
            line-height: 1.6;
        }

        .viewer-ai-ask-section {
            display: grid;
            gap: 0.55rem;
        }

        .viewer-ai-ask-label {
            color: var(--muted);
            font-size: 0.9rem;
            font-weight: 800;
        }

        .viewer-ai-ask-selection {
            max-height: min(24vh, 13rem);
            overflow: auto;
            margin: 0;
            padding: 1rem 1.1rem;
            border-left: 3px solid var(--accent);
            border-radius: 0 18px 18px 0;
            background: rgba(var(--accent-rgb), 0.08);
            white-space: pre-wrap;
            line-height: 1.75;
            color: var(--ink);
            font-family: inherit;
            font-size: 0.98rem;
        }

        .viewer-ai-ask-answer {
            min-height: 5rem;
            max-height: min(34vh, 18rem);
            overflow: auto;
            padding: 1rem 1.1rem;
            border: 1px solid rgba(var(--ink-rgb), 0.1);
            border-radius: 18px;
            background: rgba(var(--surface-rgb), 0.94);
            line-height: 1.75;
        }

        .viewer-ai-ask-answer.is-muted {
            color: var(--muted);
        }

        .viewer-ai-ask-answer.is-error {
            border-color: rgba(var(--error-rgb), 0.18);
            color: var(--error);
        }

        .viewer-ai-ask-actions {
            display: flex;
            align-items: center;
            gap: 0.75rem;
            justify-content: space-between;
            flex-wrap: wrap;
        }

        .viewer-ai-ask-actions-main {
            display: flex;
            align-items: center;
            gap: 0.75rem;
            flex-wrap: wrap;
        }

        .viewer-image-viewport {
            position: relative;
            display: flex;
            align-items: center;
            justify-content: center;
            width: min(100%, 1600px);
            height: calc(100vh - 8rem);
            overflow: hidden;
            border-radius: 28px;
            background:
                radial-gradient(circle at top left, rgba(164, 92, 64, 0.18), transparent 18rem),
                linear-gradient(180deg, rgba(64, 49, 42, 0.92), rgba(21, 16, 13, 0.98));
            touch-action: none;
            user-select: none;
        }

        .viewer-image-viewport.is-zoomed {
            cursor: grab;
        }

        .viewer-image-viewport.is-dragging {
            cursor: grabbing;
        }

        .viewer-image {
            display: block;
            max-width: 100%;
            max-height: 100%;
            border-radius: 20px;
            box-shadow: 0 36px 96px rgba(0, 0, 0, 0.4);
            cursor: default;
            transform-origin: center center;
            will-change: transform;
            user-select: none;
        }

        .viewer-frame {
            width: 100%;
            height: calc(100vh - 8rem);
            border: none;
            border-radius: 20px;
            background: #fff;
            box-shadow: 0 36px 96px rgba(0, 0, 0, 0.32);
        }

        .viewer-empty {
            max-width: 40rem;
            padding: 2rem;
            border-radius: 24px;
            background: rgba(255, 250, 244, 0.08);
            border: 1px solid rgba(255, 250, 244, 0.12);
            text-align: center;
        }

        .viewer-empty h1 {
            margin: 0 0 0.75rem;
            font-size: 1.4rem;
        }

        .viewer-empty p {
            margin: 0;
            color: rgba(255, 250, 244, 0.72);
            line-height: 1.7;
        }

        @media (max-width: 720px) {
            .viewer-toolbar {
                grid-template-columns: auto minmax(0, 1fr);
                align-items: center;
                gap: 0.7rem;
                padding: 0.75rem;
            }

            .viewer-toolbar .btn,
            .viewer-pdf-controls .btn {
                min-height: 2.25rem;
                padding: 0.5rem 0.75rem;
                font-size: 0.86rem;
            }

            .viewer-meta {
                gap: 0.12rem;
            }

            .viewer-meta span {
                font-size: 0.72rem;
            }

            .viewer-meta strong {
                font-size: 0.92rem;
            }

            .viewer-toolbar-actions {
                grid-column: 1 / -1;
                justify-content: flex-start;
            }

            .viewer-pdf-controls {
                grid-column: 1 / -1;
                width: 100%;
                justify-content: flex-start;
                gap: 0.45rem;
            }

            .viewer-pdf-control-group {
                flex: 1 1 auto;
                justify-content: center;
                background: rgba(255, 250, 244, 0.045);
            }

            .viewer-pdf-page-control > span:first-child {
                position: absolute;
                width: 1px;
                height: 1px;
                overflow: hidden;
                clip: rect(0, 0, 0, 0);
                white-space: nowrap;
            }

            .viewer-pdf-page-input {
                width: 3.25rem;
                min-height: 2.15rem;
            }

            .viewer-pdf-zoom-label {
                min-width: 3rem;
            }

            .viewer-stage {
                padding: 1rem;
            }

            .viewer-stage.pdf-mode {
                padding: 0;
            }

            .viewer-pdf-scroll {
                padding: 0.75rem 0;
            }

            .viewer-pdf-scroll .pdfViewer.viewer-pdf-official .page {
                margin-bottom: 0.75rem;
                box-shadow: 0 8px 24px rgba(35, 26, 20, 0.18);
            }

            .viewer-image-viewport,
            .viewer-frame {
                height: calc(100vh - 10rem);
            }
        }
    </style>
</head>
<body class="viewer-page">
    <div class="viewer-shell">
        <header class="viewer-toolbar">
            <button id="viewerCloseButton" class="btn btn-outline" type="button" data-i18n="viewer.btn_back">返回</button>
            <div class="viewer-meta">
                <span id="viewerKindLabel" data-i18n="viewer.kind_label">文件查看</span>
                <strong id="viewerTitle" data-i18n="viewer.loading">正在加载...</strong>
            </div>
            <div id="viewerToolbarActions" class="viewer-toolbar-actions" hidden>
                <span id="viewerImageHint" class="viewer-image-hint" data-i18n="viewer.image_hint">滚轮缩放，按住左键或中键拖动</span>
                <button id="viewerResetButton" class="btn btn-outline" type="button" disabled data-i18n="viewer.reset_view">复原视图</button>
            </div>
            <div id="viewerPdfControls" class="viewer-pdf-controls" hidden>
                <div class="viewer-pdf-control-group">
                    <button id="viewerPdfPrevButton" class="btn btn-outline" type="button" data-i18n="viewer.pdf_prev">上一页</button>
                    <label class="viewer-pdf-page-control">
                        <span data-i18n="viewer.pdf_page_label">页码</span>
                        <input id="viewerPdfPageInput" class="viewer-pdf-page-input" type="number" min="1" value="1">
                        <span id="viewerPdfPageTotal">/ 1</span>
                    </label>
                    <button id="viewerPdfNextButton" class="btn btn-outline" type="button" data-i18n="viewer.pdf_next">下一页</button>
                </div>
                <div class="viewer-pdf-control-group">
                    <button id="viewerPdfZoomOutButton" class="btn btn-outline" type="button" data-i18n="viewer.pdf_zoom_out">缩小</button>
                    <span id="viewerPdfZoomLabel" class="viewer-pdf-zoom-label">100%</span>
                    <button id="viewerPdfZoomInButton" class="btn btn-outline" type="button" data-i18n="viewer.pdf_zoom_in">放大</button>
                    <button id="viewerPdfFitButton" class="btn btn-outline" type="button" data-i18n="viewer.pdf_fit_width">适合宽度</button>
                </div>
                <div class="viewer-pdf-control-group">
                    <a id="viewerPdfDetailLink" class="btn btn-outline" href="/ai" data-i18n="viewer.pdf_ask_ai" hidden>在 AI 中追问</a>
                </div>
            </div>
        </header>
        <main id="viewerStage" class="viewer-stage" aria-live="polite"></main>
    </div>
    <div id="viewerSelectionMenu" class="viewer-selection-menu hidden">
        <button type="button" data-pdf-selection-action="copy" data-i18n="viewer.pdf_copy_selection">复制</button>
        <button type="button" data-pdf-selection-action="translate" data-i18n="viewer.pdf_translate_selection">翻译</button>
        <button type="button" data-pdf-selection-action="highlight" data-i18n="viewer.pdf_highlight_selection">高亮</button>
        <button type="button" data-pdf-selection-action="ask-ai" data-i18n="viewer.pdf_ask_selection">AI 提问</button>
    </div>

    <script src="/static/js/theme.js"></script>
    <script src="/static/js/i18n.js"></script>
    <script src="/static/js/utils.js"></script>
    <script src="/static/js/api.js"></script>
    <script src="/static/js/translate.js"></script>
    <script src="/static/js/viewer.js"></script>
</body>
</html>
