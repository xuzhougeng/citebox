<!doctype html>
<html lang="zh-CN">
<head>
    <meta charset="utf-8" />
    <title data-i18n="_title">总览 - CiteBox</title>
    <link rel="stylesheet" href="/static/css/overview.css" />
</head>
<body>
    <header class="overview-topbar">
        <a href="/" class="overview-brand" data-i18n="overview.brand">CiteBox</a>
        <span class="overview-divider">·</span>
        <span class="overview-title" data-i18n="overview.title">总览</span>
        <nav class="overview-nav">
            <a href="/" data-i18n="nav.library">文献库</a>
            <a href="/figures.html" data-i18n="nav.figures">图片库</a>
            <a href="/highlights" data-i18n="nav.highlights">高亮库</a>
            <a href="/ai.html" data-i18n="nav.ai">AI 助手</a>
            <a href="/research.html" data-i18n="nav.research">文献搜索</a>
        </nav>
    </header>
    <main class="overview-grid">
        <section id="panel-research" class="overview-panel">
            <header class="overview-panel-header">
                <h2 data-i18n="overview.panel.research">Research Dashboard</h2>
                <span class="overview-panel-sub" data-i18n="overview.panel.research_sub">最近导入</span>
            </header>
            <div class="overview-panel-body" data-bind="recent-papers">
                <p class="overview-loading" data-i18n="msg.loading">加载中...</p>
            </div>
        </section>
        <section id="panel-figure" class="overview-panel">
            <header class="overview-panel-header">
                <h2 data-i18n="overview.panel.figure">图片</h2>
                <span class="overview-panel-sub" data-i18n="overview.panel.figure_sub">每日推荐</span>
            </header>
            <div class="overview-panel-body" data-bind="daily-figure">
                <p class="overview-loading" data-i18n="msg.loading">加载中...</p>
            </div>
        </section>
        <section id="panel-status" class="overview-panel">
            <header class="overview-panel-header">
                <h2 data-i18n="overview.panel.status">Status</h2>
                <span class="overview-panel-sub" data-i18n="overview.panel.status_sub">运行状态</span>
            </header>
            <div class="overview-panel-body" data-bind="status">
                <p class="overview-loading" data-i18n="msg.loading">加载中...</p>
            </div>
        </section>
    </main>
    <script src="/static/js/i18n.js"></script>
    <script src="/static/js/overview.js"></script>
</body>
</html>
