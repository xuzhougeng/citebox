<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI 助手 - CiteBox</title>
    <link rel="icon" type="image/svg+xml" href="/static/img/citebox-icon.svg">
    <script>(function(){var d=document.documentElement;try{var t=localStorage.getItem("citebox_theme");if(t&&t!=="warm")d.setAttribute("data-theme",t);var l=localStorage.getItem("citebox_lang")||"zh-CN";d.lang=l;if(l!=="zh-CN")d.setAttribute("data-lang-loading","1");}catch(e){}})()</script>
    <link rel="stylesheet" href="/static/css/style.css?v=ai-20260805a">
</head>
<body>
    <nav class="navbar">
        <div class="navbar-content">
            <a href="/" class="logo">CiteBox</a>
            <ul class="nav-links">
                <li><a href="/" data-i18n="nav.overview">总览</a></li>
                <li><a href="/library" data-i18n="nav.library">文献库</a></li>
                <li><a href="/figures" data-i18n="nav.figures">图片库</a></li>
                <li><a href="/palettes" data-i18n="nav.palettes">配色库</a></li>
                <li><a href="/groups" data-i18n="nav.groups">分组</a></li>
                <li><a href="/tags" data-i18n="nav.tags">标签</a></li>
                <li><a href="/notes" data-i18n="nav.notes">笔记</a></li>
                <li><a href="/highlights" data-i18n="nav.highlights">高亮库</a></li>
                <li><a href="/research" data-i18n="nav.research">文献搜索</a></li>
                <li><a href="/ai" class="active" data-i18n="nav.ai">AI 助手</a></li>
                <li><a href="/settings" data-i18n="nav.settings">配置</a></li>
            </ul>
            <div class="nav-actions">
                <a href="/upload" class="nav-cta" data-i18n="nav.upload_pdf">上传 PDF</a>
            </div>
        </div>
    </nav>

    <main class="page-shell ai-page-shell">
        <aside id="aiSidebar" class="ai-sidebar">
            <div class="ai-sidebar-head">
                <div class="ai-sidebar-head-row">
                    <button id="aiNewConversation" class="btn btn-primary btn-block" type="button" data-i18n="ai.btn_new_conversation">＋ 新对话</button>
                    <button id="aiSidebarCollapse" class="ai-sidebar-collapse" type="button"
                        aria-label="收起对话侧栏" data-i18n-aria-label="ai.sidebar_collapse"
                        title="收起侧栏" data-i18n-title="ai.sidebar_collapse">«</button>
                </div>
                <input id="aiConversationSearch" class="form-input ai-sidebar-search" type="text" data-i18n-placeholder="ai.sidebar_search_placeholder" placeholder="搜索对话…">
            </div>
            <ul id="aiConversationList" class="ai-conversation-list" role="list"></ul>
            <div id="aiSidebarEmpty" class="ai-sidebar-empty" hidden>
                <p data-i18n="ai.sidebar_empty">还没有对话。点 + 新对话开始。</p>
            </div>
            <button id="aiMoreConversations" class="btn btn-outline ai-sidebar-more" type="button" data-i18n="ai.btn_more_conversations">更多对话</button>
        </aside>

        <button id="aiSidebarExpand" class="ai-sidebar-expand" type="button"
            aria-label="展开对话侧栏" data-i18n-aria-label="ai.sidebar_expand"
            title="展开侧栏" data-i18n-title="ai.sidebar_expand">»</button>

        <section class="ai-main">
            <header class="ai-main-head">
                <div class="ai-main-title-group">
                    <h2 id="aiActiveTitle" class="ai-active-title" data-i18n="ai.active_title_default">新对话</h2>
                    <div id="aiPinChips" class="ai-pin-chips"></div>
                </div>
                <div class="ai-main-actions">
                    <button id="aiPdfPanelToggle" class="btn btn-outline btn-small" type="button" data-i18n="ai.pdf_panel_toggle">预览 PDF</button>
                    <button id="aiExportConversation" class="btn btn-outline btn-small" type="button" data-i18n="ai.btn_export_conversation">对话导出</button>
                    <button id="aiDeleteConversation" class="btn btn-outline btn-small" type="button" data-i18n="ai.btn_delete_conversation">删除</button>
                </div>
            </header>

            <div id="aiConversation" class="ai-conversation"></div>

            <footer class="ai-composer">
                <div class="ai-composer-tools">
                    <div class="ai-mode-toggles" hidden>
                        <label class="ai-strict-toggle">
                            <input id="aiStrictEvidenceToggle" type="checkbox">
                            <span data-i18n="ai.strict_evidence">内部搜索</span>
                        </label>
                        <label class="ai-strict-toggle">
                            <input id="aiExternalEvidenceToggle" type="checkbox">
                            <span data-i18n="ai.external_evidence">外部搜索</span>
                        </label>
                    </div>
                    <div id="aiIntentShortcuts" class="ai-intent-shortcuts" aria-label="AI 任务快捷入口" data-i18n-aria-label="ai.intent_shortcuts_label"></div>
                    <p id="aiRolePromptHint" class="ai-role-prompt-hint" data-i18n="ai.role_prompt_hint">输入 @ 唤起选择面板。</p>
                </div>
                <label class="field ai-question-field">
                    <span class="ai-question-label" data-i18n="ai.question_label">想让 AI 帮你什么？</span>
                    <div id="aiContextTray" class="ai-context-tray" hidden></div>
                    <div class="ai-question-input-wrap">
                        <div id="aiQuestionMirror" class="ai-question-mirror" aria-hidden="true"></div>
                        <textarea id="aiQuestionInput" class="form-textarea ai-question-input" rows="2" data-i18n-placeholder="ai.question_placeholder" placeholder="输入 @ 切换文献或调用角色…" spellcheck="false"></textarea>
                        <div id="aiMentionPopover" class="ai-mention-popover" role="listbox" aria-label="@ 选项" hidden></div>
                    </div>
                </label>
                <div class="ai-composer-bottom">
                    <div id="aiRolePromptQuickList" class="ai-role-prompt-list"></div>
                    <div class="submit-row">
                        <div id="aiModelSummary" class="ai-model-summary"></div>
                        <button id="stopAIReaderButton" class="btn btn-outline" type="button" hidden data-i18n="ai.btn_stop">停止生成</button>
                        <button id="runAIReaderButton" class="btn btn-primary" type="button" data-i18n="ai.btn_send">发送问题</button>
                    </div>
                </div>
            </footer>
        </section>

        <aside id="aiPdfPanel" hidden></aside>
    </main>

    <div id="paperModal" class="modal-shell hidden">
        <div class="modal-dialog">
            <button id="closePaperModal" class="modal-close" type="button" aria-label="关闭" data-i18n-aria-label="ai.btn_close_modal">×</button>
            <div id="paperModalBody"></div>
        </div>
    </div>

    <div id="aiGeneratedImageModal" class="modal-shell hidden">
        <div class="modal-dialog ai-image-preview-modal-dialog">
            <button class="modal-close" type="button" aria-label="关闭" data-ai-image-preview-close data-i18n-aria-label="ai.btn_close_modal">×</button>
            <div class="ai-image-preview-modal-body">
                <img id="aiGeneratedImagePreview" class="ai-image-preview-modal-image" alt="">
            </div>
        </div>
    </div>

    <script src="/static/js/theme.js"></script>
    <script src="/static/js/i18n.js"></script>
    <script src="/static/js/utils.js?v=20260501-p3"></script>
    <script src="/static/js/api.js"></script>
    <script src="/static/js/paper-viewer.js"></script>
    <script src="/static/js/figure-viewer.js"></script>
    <script src="/static/js/note-viewer.js"></script>
    <script src="/static/js/main.js"></script>
    <script src="/static/js/ai-mention-tags.js?v=20260503-ai-image-ui"></script>
    <script src="/static/js/ai-mention.js?v=20260501-p4"></script>
    <script src="/static/js/ai-pin.js?v=20260804c"></script>
    <script src="/static/js/ai-conversations.js?v=20260501-p3-conversations"></script>
    <script src="/static/js/ai-composer.js"></script>
    <script src="/static/js/ai-message-list.js"></script>
    <script src="/static/js/ai-process-strip.js?v=20260501-1"></script>
    <script src="/static/js/ai-result-cards.js?v=20260503-ai-image-ui"></script>
    <script src="/static/js/ai-conversation-view.js?v=20260804c"></script>
    <script src="/static/js/ai-evidence.js"></script>
    <script src="/static/js/ai-pdf-panel.js?v=20260805a"></script>
    <script src="/static/js/ai-reader.js?v=20260804c"></script>
    <script src="/static/js/translate.js"></script>
</body>
</html>
