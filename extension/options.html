<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8">
    <title>CiteBox Connector</title>
    <style>
        body {
            font-family: system-ui, sans-serif;
            font-size: 14px;
            max-width: 480px;
            margin: 24px auto;
            padding: 0 16px;
            color: #222;
        }
        h1 {
            font-size: 18px;
        }
        label {
            display: block;
            margin: 14px 0 4px;
            font-weight: 600;
        }
        input {
            width: 100%;
            box-sizing: border-box;
            padding: 6px 8px;
        }
        .actions {
            margin-top: 18px;
            display: flex;
            gap: 10px;
        }
        button {
            padding: 6px 16px;
            cursor: pointer;
        }
        #status {
            margin-top: 14px;
            min-height: 1em;
        }
        #status.ok {
            color: #137333;
        }
        #status.err {
            color: #c5221f;
        }
    </style>
</head>
<body>
    <h1 data-i18n="optionsHeader"></h1>

    <label for="server-url" data-i18n="serverUrlLabel"></label>
    <input id="server-url" type="text" data-i18n-placeholder="serverUrlPlaceholder">

    <label for="token" data-i18n="tokenLabel"></label>
    <input id="token" type="password" data-i18n-placeholder="tokenPlaceholder">

    <div class="actions">
        <button id="btn-save" data-i18n="saveButton"></button>
        <button id="btn-test" data-i18n="testConnection"></button>
    </div>

    <p id="status"></p>

    <script src="options.js"></script>
</body>
</html>
