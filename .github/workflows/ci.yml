name: CI

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  test:
    name: Test
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.26.x"
          cache: true

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install GTK headers
        run: |
          sudo apt-get update
          sudo apt-get install -y libgtk-3-dev pkg-config

      - name: Cache go-fitz static libs
        uses: actions/cache@v4
        with:
          path: third_party/go-fitz/libs
          key: go-fitz-${{ runner.os }}-amd64-${{ hashFiles('third_party/go-fitz/fitz.go') }}

      - name: Prepare go-fitz libs
        run: ./scripts/prepare-go-fitz-libs.sh --goos linux --goarch amd64

      - name: Install PowerShell
        run: |
          if command -v pwsh >/dev/null 2>&1; then
            pwsh -NoProfile -Command '$PSVersionTable.PSVersion.ToString()'
            exit 0
          fi
          curl -fsSL -o /tmp/powershell.tar.gz -L https://github.com/PowerShell/PowerShell/releases/download/v7.5.4/powershell-7.5.4-linux-x64.tar.gz
          sudo mkdir -p /opt/microsoft/powershell/7
          sudo tar -xzf /tmp/powershell.tar.gz -C /opt/microsoft/powershell/7
          sudo chmod +x /opt/microsoft/powershell/7/pwsh
          sudo ln -sfn /opt/microsoft/powershell/7/pwsh /usr/local/bin/pwsh
          pwsh -NoProfile -Command '$PSVersionTable.PSVersion.ToString()'

      - name: Run CI checks
        env:
          CGO_ENABLED: "1"
        run: make ci
